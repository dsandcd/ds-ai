
<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DS AI - Sinhala AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <header>
      <div class="logo">DS</div>
      <div>
        <h1>DS AI</h1>
        <p>ඔබේ සිංහල AI සහායකයා ❤️</p>
      </div>
    </header>

    <main id="chat">
      <div class="message bot">
        ආයුබෝවන්! 👋 මම DS AI.
        අද ඔබට උදව් කරන්නේ කොහොමද?
      </div>
    </main>

    <div class="input-area">
      <input
        id="message"
        type="text"
        placeholder="මෙතැන ලියන්න..."
      >

      <button id="mic">🎙️</button>
      <button id="send">➤</button>
    </div>

    <p class="footer">Powered by DS AI</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
